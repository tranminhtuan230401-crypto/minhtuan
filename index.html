```html
<!DOCTYPE html>
<html lang="vi">
<h1>VERSION 2</h1>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Điều khiển động cơ</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding-top: 50px;
        }

        h1 {
            margin-bottom: 40px;
        }

        button {
            width: 250px;
            height: 100px;
            font-size: 28px;
            font-weight: bold;
            margin: 15px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            user-select: none;
            touch-action: none;
        }

        #forward {
            background: #4CAF50;
            color: white;
        }

        #reverse {
            background: #2196F3;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }

        #status {
            margin-top: 30px;
            font-size: 24px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <h1>ĐIỀU KHIỂN ĐỘNG CƠ</h1>

    <button id="forward">
        QUAY THUẬN
    </button>

    <button id="reverse">
        QUAY NGHỊCH
    </button>

    <div id="status">
        ĐANG DỪNG
    </div>


    <script type="module">

        // ==============================
        // FIREBASE
        // ==============================

        import {
            initializeApp
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


        import {
            getDatabase,
            ref,
            set
        }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";


        // ==============================
        // FIREBASE CONFIG
        // ==============================

        const firebaseConfig = {

            apiKey:
                "AIzaSyCXOm1P9DtqeN5lvXxg-lCir3eMhVB85TY",

            authDomain:
                "aaaaa-a62e1.firebaseapp.com",

            databaseURL:
                "https://aaaaa-a62e1-default-rtdb.asia-southeast1.firebasedatabase.app",

            projectId:
                "aaaaa-a62e1",

            storageBucket:
                "aaaaa-a62e1.firebasestorage.app",

            messagingSenderId:
                "288410644557",

            appId:
                "1:288410644557:web:ee8336557db230cae5ac04",

            measurementId:
                "G-ZH69X78RYS"
        };


        // ==============================
        // KHỞI TẠO FIREBASE
        // ==============================

        const app =
            initializeApp(firebaseConfig);

        const database =
            getDatabase(app);


        // ==============================
        // VỊ TRÍ MOTOR
        // ==============================

        const motorCommand =
            ref(database, "motor/command");


        // ==============================
        // GỬI LỆNH
        // ==============================

        function sendCommand(command) {

            set(motorCommand, command)

                .then(() => {

                    console.log(
                        "Đã gửi:",
                        command
                    );

                })

                .catch((error) => {

                    console.error(
                        "Lỗi Firebase:",
                        error
                    );

                    document.getElementById(
                        "status"
                    ).innerText =
                        "LỖI FIREBASE";
                });
        }


        // ==============================
        // HIỂN THỊ TRẠNG THÁI
        // ==============================

        function status(text) {

            document.getElementById(
                "status"
            ).innerText = text;

        }


        // ==============================
        // QUAY THUẬN
        // ==============================

        const forward =
            document.getElementById("forward");


        forward.addEventListener(
            "pointerdown",
            function (e) {

                e.preventDefault();

                sendCommand("forward");

                status("ĐANG QUAY THUẬN");

            }
        );


        // ==============================
        // QUAY NGHỊCH
        // ==============================

        const reverse =
            document.getElementById("reverse");


        reverse.addEventListener(
            "pointerdown",
            function (e) {

                e.preventDefault();

                sendCommand("reverse");

                status("ĐANG QUAY NGHỊCH");

            }
        );


        // ==============================
        // DỪNG
        // ==============================

        function stopMotor(e) {

            if (e) {
                e.preventDefault();
            }

            sendCommand("stop");

            status("ĐANG DỪNG");

        }


        // ==============================
        // THẢ NÚT
        // ==============================

        forward.addEventListener(
            "pointerup",
            stopMotor
        );

        reverse.addEventListener(
            "pointerup",
            stopMotor
        );


        // ==============================
        // RỜI KHỎI NÚT
        // ==============================

        forward.addEventListener(
            "pointerleave",
            stopMotor
        );

        reverse.addEventListener(
            "pointerleave",
            stopMotor
        );


        // ==============================
        // HỦY TƯƠNG TÁC
        // ==============================

        forward.addEventListener(
            "pointercancel",
            stopMotor
        );

        reverse.addEventListener(
            "pointercancel",
            stopMotor
        );

    </script>

</body>

</html>
